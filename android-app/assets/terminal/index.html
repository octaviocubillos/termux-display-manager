<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Termux Web Terminal - TDM</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        :root {
            --bg-color: #0b0f19;
            --surface-color: #111827;
            --primary: #a8c7fa;
            --text-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            background: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* HEADER */
        .terminal-header {
            background: var(--surface-color);
            padding: 0.35rem 0.75rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            min-height: 40px;
            z-index: 10;
            flex-shrink: 0;
        }

        .terminal-title {
            display: flex;
            align-items: center;
            gap: 0.45rem;
            font-size: 0.82rem;
            font-weight: 700;
            color: #fff;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #eab308;
        }

        .status-dot.online {
            background: #22c55e;
            box-shadow: 0 0 6px rgba(34, 197, 94, 0.6);
        }

        .status-dot.offline {
            background: #ef4444;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 0.35rem;
        }

        .btn-tool {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #e2e8f0;
            border-radius: 6px;
            padding: 0.2rem 0.5rem;
            font-size: 0.75rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.25rem;
            cursor: pointer;
            transition: background 0.15s ease;
        }

        .btn-tool:hover {
            background: rgba(255, 255, 255, 0.18);
            color: #fff;
        }

        .btn-tool .material-symbols-rounded {
            font-size: 1rem;
        }

        /* TERMINAL CONTAINER */
        #terminal-container {
            flex: 1;
            width: 100%;
            height: 100%;
            min-height: 0;
            padding: 4px;
            background: #000;
            overflow: hidden;
            position: relative;
        }

        .xterm {
            height: 100%;
            padding: 4px;
        }

        .xterm-viewport {
            overflow-y: auto !important;
            -webkit-overflow-scrolling: touch;
        }

        /* MOBILE VIRTUAL KEYS BAR */
        .virtual-keys-bar {
            background: #111622;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            overflow-x: auto;
            padding: 0.25rem 0.4rem;
            gap: 0.35rem;
            flex-shrink: 0;
            scrollbar-width: none;
        }

        .virtual-keys-bar::-webkit-scrollbar {
            display: none;
        }

        .vkey {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            border-radius: 4px;
            padding: 0.35rem 0.65rem;
            font-size: 0.74rem;
            font-family: monospace;
            font-weight: 700;
            white-space: nowrap;
            cursor: pointer;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 38px;
            height: 32px;
        }

        .vkey:active, .vkey.active {
            background: var(--primary);
            color: #062e6f;
        }

        /* EMBEDDED MODE */
        body.is-embedded .terminal-header {
            display: none;
        }
    </style>
</head>
<body>

    <!-- TERMINAL HEADER -->
    <div class="terminal-header" id="termHeader">
        <div class="terminal-title">
            <span class="status-dot" id="termStatusDot"></span>
            <span id="termStatusText">Termux Bash Terminal</span>
        </div>
        <div class="header-actions">
            <button class="btn-tool" onclick="toggleVirtualKeys()" title="Teclado Virtual">
                <span class="material-symbols-rounded">keyboard</span>
                <span>Teclas</span>
            </button>
            <button class="btn-tool" onclick="connectTerminal()" title="Reconectar">
                <span class="material-symbols-rounded">refresh</span>
            </button>
            <button class="btn-tool" onclick="toggleFullscreen()" title="Pantalla Completa">
                <span class="material-symbols-rounded" id="icoFs">fullscreen</span>
            </button>
        </div>
    </div>

    <!-- TERMINAL MAIN BOX -->
    <div id="terminal-container"></div>

    <!-- MOBILE VIRTUAL KEYS -->
    <div class="virtual-keys-bar" id="virtualKeys">
        <button class="vkey" onclick="sendKey('\x1b')">ESC</button>
        <button class="vkey" onclick="sendKey('\t')">TAB</button>
        <button class="vkey" id="btnCtrl" onclick="toggleCtrl()">CTRL</button>
        <button class="vkey" id="btnAlt" onclick="toggleAlt()">ALT</button>
        <button class="vkey" onclick="sendKey('\x1b[A')">▲</button>
        <button class="vkey" onclick="sendKey('\x1b[B')">▼</button>
        <button class="vkey" onclick="sendKey('\x1b[D')">◀</button>
        <button class="vkey" onclick="sendKey('\x1b[C')">▶</button>
        <button class="vkey" onclick="sendKey('~')">~</button>
        <button class="vkey" onclick="sendKey('/')">/</button>
        <button class="vkey" onclick="sendKey('|')">|</button>
        <button class="vkey" onclick="sendKey('-')">-</button>
        <button class="vkey" onclick="sendKey('\x03')">^C</button>
        <button class="vkey" onclick="sendKey('\x04')">^D</button>
        <button class="vkey" onclick="sendKey('\x0c')">CLEAR</button>
        <button class="vkey" onclick="pasteClipboard()">PASTE</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>

    <script>
        let term = null;
        let fitAddon = null;
        let ws = null;
        let isCtrl = false;
        let isAlt = false;

        function initTerminal() {
            if (window.self !== window.top) {
                document.body.classList.add('is-embedded');
            }

            if (typeof Terminal === 'undefined') {
                document.getElementById('terminal-container').innerHTML = '<div style="color: #ef4444; padding: 20px; font-family: monospace;">Error: xterm.js no disponible. Verifique conexión.</div>';
                return;
            }

            term = new Terminal({
                cursorBlink: true,
                cursorStyle: 'block',
                fontSize: window.innerWidth < 768 ? 13 : 15,
                fontFamily: 'Consolas, Monaco, "Courier New", monospace',
                theme: {
                    background: '#000000',
                    foreground: '#f8fafc',
                    cursor: '#a8c7fa',
                    selectionBackground: 'rgba(168, 199, 250, 0.3)',
                    black: '#000000',
                    red: '#ef4444',
                    green: '#22c55e',
                    yellow: '#eab308',
                    blue: '#3b82f6',
                    magenta: '#d946ef',
                    cyan: '#06b6d4',
                    white: '#f8fafc'
                },
                allowProposedApi: true
            });

            if (typeof FitAddon !== 'undefined' && FitAddon.FitAddon) {
                fitAddon = new FitAddon.FitAddon();
                term.loadAddon(fitAddon);
            }

            const container = document.getElementById('terminal-container');
            term.open(container);

            if (fitAddon) {
                setTimeout(() => fitAddon.fit(), 100);
            }

            term.onData(data => {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    if (isCtrl) {
                        isCtrl = false;
                        document.getElementById('btnCtrl').classList.remove('active');
                        if (data.length === 1) {
                            const code = data.charCodeAt(0);
                            if (code >= 97 && code <= 122) { // a-z
                                ws.send(String.fromCharCode(code - 96));
                                return;
                            } else if (code >= 65 && code <= 90) { // A-Z
                                ws.send(String.fromCharCode(code - 64));
                                return;
                            }
                        }
                    }
                    if (isAlt) {
                        isAlt = false;
                        document.getElementById('btnAlt').classList.remove('active');
                        ws.send('\x1b' + data);
                        return;
                    }
                    ws.send(data);
                }
            });

            window.addEventListener('resize', handleResize);
            connectTerminal();
        }

        function handleResize() {
            if (fitAddon && term) {
                fitAddon.fit();
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({
                        type: 'resize',
                        cols: term.cols,
                        rows: term.rows
                    }));
                }
            }
        }

        function connectTerminal() {
            const dot = document.getElementById('termStatusDot');
            const txt = document.getElementById('termStatusText');
            if (dot) dot.className = 'status-dot';
            if (txt) txt.innerText = 'Conectando a Termux PTY...';

            if (ws) {
                try { ws.close(); } catch(e){}
            }

            const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const host = window.location.host;
            const wsUrl = `${proto}//${host}/ws/terminal`;

            try {
                ws = new WebSocket(wsUrl);
                ws.binaryType = 'arraybuffer';

                ws.onopen = () => {
                    if (dot) dot.className = 'status-dot online';
                    if (txt) txt.innerText = 'Termux Core (PTY Conectado)';
                    handleResize();
                    term.focus();
                };

                ws.onmessage = (e) => {
                    if (typeof e.data === 'string') {
                        term.write(e.data);
                    } else if (e.data instanceof ArrayBuffer) {
                        const uint8 = new Uint8Array(e.data);
                        term.write(uint8);
                    }
                };

                ws.onclose = () => {
                    if (dot) dot.className = 'status-dot offline';
                    if (txt) txt.innerText = 'Desconectado (Pulsa Reconectar)';
                    term.write('\r\n\x1b[31m[TDM] Sesión de terminal finalizada. Pulsa Reconectar para abrir una nueva consola.\x1b[0m\r\n');
                };

                ws.onerror = () => {
                    if (dot) dot.className = 'status-dot offline';
                    if (txt) txt.innerText = 'Error de conexión';
                };
            } catch(err) {
                if (dot) dot.className = 'status-dot offline';
                if (txt) txt.innerText = 'Error: ' + err.message;
            }
        }

        function sendKey(key) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(key);
                term.focus();
            }
        }

        function toggleCtrl() {
            isCtrl = !isCtrl;
            document.getElementById('btnCtrl').classList.toggle('active', isCtrl);
        }

        function toggleAlt() {
            isAlt = !isAlt;
            document.getElementById('btnAlt').classList.toggle('active', isAlt);
        }

        function toggleVirtualKeys() {
            const bar = document.getElementById('virtualKeys');
            bar.style.display = (bar.style.display === 'none') ? 'flex' : 'none';
            handleResize();
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
                document.getElementById('icoFs').innerText = 'fullscreen_exit';
            } else {
                document.exitFullscreen().catch(() => {});
                document.getElementById('icoFs').innerText = 'fullscreen';
            }
        }

        async function pasteClipboard() {
            try {
                const text = await navigator.clipboard.readText();
                if (text && ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(text);
                }
            } catch(e) {
                const txt = prompt('Pega el texto a enviar al terminal:');
                if (txt && ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(txt);
                }
            }
        }

        document.addEventListener('DOMContentLoaded', initTerminal);
    </script>
</body>
</html>
