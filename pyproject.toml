[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "termux-display-manager"
version = "1.0.0"
description = "Gestor de pantallas y servidores gráficos para Termux y Android"
readme = "README.md"
authors = [{ name = "TDM Project" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.scripts]
tdm = "tdm.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tdm*"]
