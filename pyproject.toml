[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "termux-display-manager"
version = "0.0.53"
description = "Motor unificado de entornos gráficos nativos y visor web para Termux y Android"
readme = "README.md"
authors = [{ name = "TDM Project" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.scripts]
tdm = "tdm.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tdm*"]

[tool.setuptools.package-data]
tdm = [
    "web/**/*",
    "web/*",
    "scripts/*",
]
