# Configuración Nginx para Landing Page de TDM con Reverse Proxy HTTP/WS en /aabbcc
server {
    listen 80;
    listen 443 ssl http2;
    server_name tdm.oton.cl;

    root /var/www/tdm-landing;
    index index.html;

    # 1. Reverse Proxy Dinámico por Hash de 8 letras (/abcdefgh/...) y API Hub hacia server.py
    location ~ ^/[a-z]{8}(/.*)?$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Reverse Proxy Legacy (/aabbcc/)
    location /aabbcc/ {
        proxy_pass http://127.0.0.1:8080/aabbcc/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    location = /aabbcc {
        return 301 /aabbcc/;
    }

    # 2. Servir Scripts e Instaladores Directos (Solo clientes de consola / no navegadores)
    location ~ ^/(install|go|setup|clean)(\.sh)?$ {
        if ($http_user_agent ~* (Mozilla|Chrome|Safari|Gecko|WebKit|Edge|Opera|Firefox)) {
            return 302 /;
        }

        default_type text/plain;
        try_files $uri $uri.sh =404;
    }

    # 3. Archivos Estáticos de la Landing Page
    location / {
        try_files $uri $uri/ =404;
    }
}
