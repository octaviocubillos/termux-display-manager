# Configuración Nginx para Landing Page de TDM con Reverse Proxy HTTP/WS en /aabbcc
server {
    listen 80;
    listen 443 ssl http2;
    server_name tdm.oton.cl;

    root /var/www/tdm-landing;
    index index.html;

    # 1. Reverse Proxy HTTP y WebSocket a la App Web TDM en /aabbcc
    location /aabbcc/ {
        proxy_pass http://192.168.1.197:19050/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    location = /aabbcc {
        return 301 /aabbcc/;
    }

    # 2. Servir Scripts e Instaladores Directos
    location = /install {
        default_type text/plain;
        try_files /install.sh =404;
    }

    location = /go {
        default_type text/plain;
        try_files /go =404;
    }

    location = /setup {
        default_type text/plain;
        try_files /setup =404;
    }

    location = /clean {
        default_type text/plain;
        try_files /clean.sh =404;
    }

    # 3. Archivos Estáticos de la Landing Page
    location / {
        try_files $uri $uri/ =404;
    }
}
