<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TDM • noVNC Web Display (Lite)</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0e14;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #e2e8f0;
            display: flex;
            flex-direction: column;
        }

        #top_bar {
            background-color: #161b22;
            color: #e2e8f0;
            font-size: 12px;
            font-weight: 600;
            padding: 6px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 100;
            flex-shrink: 0;
            flex-wrap: wrap;
            gap: 6px;
        }

        #status {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-badge {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #eab308;
        }
        .status-badge.online { background: #22c55e; }
        .status-badge.offline { background: #ef4444; }

        .btn-action {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 6px;
            padding: 4px 9px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .btn-action:hover {
            background: rgba(255, 255, 255, 0.25);
        }
        .btn-action.active {
            background: #3b82f6;
            border-color: #60a5fa;
            color: #fff;
        }

        #screen {
            flex: 1;
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        #screen canvas {
            max-width: 100% !important;
            max-height: 100% !important;
            object-fit: contain;
        }
    </style>
</head>

<body>
    <div id="top_bar">
        <div id="status">
            <span class="status-badge" id="statusDot"></span>
            <span id="statusText">Iniciando visor...</span>
        </div>
        <div style="display: flex; gap: 6px; align-items: center; flex-wrap: wrap;">
            <button class="btn-action active" id="btnResize" onclick="window.toggleDynamicResize()">📐 Dimensión Dinámica</button>
            <button class="btn-action active" id="btnScale" onclick="window.toggleScale()">🔍 Auto-Escalar</button>
            <button class="btn-action" onclick="window.sendCtrlAltDel()">⌨️ Ctrl+Alt+Del</button>
            <button class="btn-action" onclick="window.openFullVersion()">🎛️ Versión Completa</button>
            <button class="btn-action" onclick="window.reconnectVnc()">🔄 Reconectar</button>
        </div>
    </div>
    <div id="screen"></div>

    <script type="module">
        import RFB from './core/rfb.js';

        let rfb = null;
        let desktopName = "Termux Desktop";
        let isDynamicResize = true;
        let isAutoScaling = true;

        function setStatus(text, state = "connecting") {
            const el = document.getElementById('statusText');
            const dot = document.getElementById('statusDot');
            if (el) el.textContent = text;
            if (dot) {
                dot.className = "status-badge " + (state === "online" ? "online" : state === "offline" ? "offline" : "");
            }
        }

        function connectedToServer(e) {
            setStatus("Conectado: " + desktopName, "online");
        }

        function disconnectedFromServer(e) {
            setStatus(e.detail.clean ? "Desconectado" : "Conexión cerrada. Pulsa Reconectar.", "offline");
        }

        function credentialsAreRequired(e) {
            const password = prompt("Introduce la contraseña de VNC:");
            if (password && rfb) rfb.sendCredentials({ password: password });
        }

        function updateDesktopName(e) {
            desktopName = e.detail.name || "Termux Desktop";
            setStatus("Conectado: " + desktopName, "online");
        }

        function sendCtrlAltDel() {
            if (rfb) rfb.sendCtrlAltDel();
            return false;
        }

        function toggleScale() {
            if (rfb) {
                isAutoScaling = !isAutoScaling;
                rfb.scaleViewport = isAutoScaling;
                const b = document.getElementById('btnScale');
                if (b) b.className = 'btn-action ' + (isAutoScaling ? 'active' : '');
            }
        }

        function toggleDynamicResize() {
            if (rfb) {
                isDynamicResize = !isDynamicResize;
                rfb.resizeSession = isDynamicResize;
                const b = document.getElementById('btnResize');
                if (b) b.className = 'btn-action ' + (isDynamicResize ? 'active' : '');
            }
        }

        function openFullVersion() {
            window.location.href = 'vnc.html' + window.location.search;
        }

        function readQueryVariable(name, defaultValue) {
            const re = new RegExp('.*[?&]' + name + '=([^&#]*)');
            const match = document.location.href.match(re);
            if (match) {
                return decodeURIComponent(match[1]);
            }
            return defaultValue;
        }

        function startConnection() {
            const screenElem = document.getElementById('screen');
            if (!screenElem) return;

            screenElem.innerHTML = '';

            const host = readQueryVariable('host', window.location.hostname || '127.0.0.1');
            let port = readQueryVariable('port', window.location.port || '19050');
            const password = readQueryVariable('password', undefined);
            const path = readQueryVariable('path', 'websockify');

            setStatus("Conectando a " + host + ":" + port + "/" + path + "...", "connecting");

            let proto = (window.location.protocol === "https:") ? "wss" : "ws";
            let url = proto + "://" + host + (port ? ":" + port : "") + "/" + path;

            try {
                if (rfb) {
                    try { rfb.disconnect(); } catch(e){}
                }

                rfb = new RFB(screenElem, url, {
                    credentials: { password: password }
                });

                rfb.addEventListener("connect", connectedToServer);
                rfb.addEventListener("disconnect", disconnectedFromServer);
                rfb.addEventListener("credentialsrequired", credentialsAreRequired);
                rfb.addEventListener("desktopname", updateDesktopName);

                rfb.viewOnly = (readQueryVariable('view_only', 'false') === 'true');
                rfb.scaleViewport = isAutoScaling;
                rfb.resizeSession = isDynamicResize;
            } catch (err) {
                setStatus("Error de inicialización: " + err.message, "offline");
            }
        }

        window.sendCtrlAltDel = sendCtrlAltDel;
        window.toggleScale = toggleScale;
        window.toggleDynamicResize = toggleDynamicResize;
        window.openFullVersion = openFullVersion;
        window.reconnectVnc = startConnection;

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', startConnection);
        } else {
            startConnection();
        }
    </script>
</body>
</html>
